<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Cargos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Cargos</h1>
        <p>Gerencie os cargos cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo cargo</h2>

        <form id="form-cargo">
          <input type="hidden" id="cargo-id">

          <label for="nome">Nome do Cargo</label>
          <input id="nome" name="nome" type="text" required placeholder="Ex: Desenvolvedor Fullstack">

          <label for="departamento">Departamento</label>
          <input id="departamento" name="departamento" type="text" required placeholder="Ex: Tecnologia">

          <label for="salarioBase">Salário Base (R$)</label>
          <input id="salarioBase" name="salarioBase" type="number" step="0.01" min="0" required placeholder="Ex: 4500.00">

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Cargos</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar cargo pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do cargo">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-cargos" class="lista-cargos"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
